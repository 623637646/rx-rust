[package]
name = "rx-rust"
version = "2.0.1"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/623637646/rx-rust"
description = "Reactive Programming in Rust inspired by ReactiveX https://reactivex.io/"
keywords = ["reactive", "rx", "reactivex", "observable", "stream"]
categories = ["asynchronous", "rust-patterns"]
include = ["/src/**", "/Cargo.toml", "/LICENSE", "/README.md"]

[package.metadata.docs.rs]
# Every scheduler module is compiled only with its feature, and the README (the crate-level docs)
# only with `tokio-scheduler`.
all-features = true

[dependencies]
educe = "0.8" # Derive bounds from fields rather than every generic parameter.
# Custom schedulers need not depend on futures.
futures = { version = "0.3.34", optional = true }
tokio = { version = "1", optional = true }
smol = { version = "2", optional = true }
async-io = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
async-io = "2"
pastey = "0.1"
# The tests run on every scheduler, so they enable every scheduler feature of the crate itself.
rx-rust = { path = ".", features = ["futures-scheduler", "tokio-scheduler", "smol-scheduler"] }

[features]
default = []

# schedulers, which can be combined
futures-scheduler = ["futures/thread-pool", "dep:async-io"]
tokio-scheduler = ["futures", "dep:tokio", "tokio/rt", "tokio/time"]
smol-scheduler = ["futures", "dep:smol"]