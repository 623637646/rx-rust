[package]
name = "rx-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = { version = "0.3.31", features = ["thread-pool"] }
# Using this to fix the issue: https://github.com/rust-lang/rust/issues/26925 
# Refer to: https://stackoverflow.com/a/79571732/9315497
educe = "0.6.0"
slotmap = "1.0.7"

# TODO: Dependent below crates in some features instead of in all.
tokio = { version = "1.40.0", optional = true, features = ["full"] }

[dev-dependencies]
tokio-stream = "0.1.17" #TODO: Remove this. 
rand = "0.9.1"
pin-project = "1.1.10"
async-std = "1.13.1"

[features]
default = ["tokio-scheduler"] #TODO: default without "tokio-scheduler"
tokio-scheduler = ["tokio"]