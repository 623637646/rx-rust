name: CI

# Every job runs one subcommand of `ci/check.sh`, which holds what is checked and how strictly, so
# that a local `ci/check.sh <job>` checks exactly what the job does. This file only says where it
# runs: the toolchain, the tools it needs, and the matrix of profiles.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # `release.yml` runs this whole workflow before publishing a tag.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  static:
    name: formatting and source rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: ci/check.sh static

  lint:
    # Clippy, which runs every rustc lint as well, on the library in every combination of its
    # features and on the tests. Each profile builds code the other does not: a release build
    # leaves out the `cfg(debug_assertions)` code.
    name: clippy (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, release]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}
      - run: ci/check.sh lint ${{ matrix.profile }}

  doc:
    name: docs and doctests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: ci/check.sh doc

  test:
    name: test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, release]
    env:
      # `.config/nextest.toml`: retries the timing-sensitive tests, and reports the ones that only
      # passed on a retry as flaky, so they stay visible without failing the run.
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}
      - run: ci/check.sh test ${{ matrix.profile }}

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: ci/check.sh msrv
