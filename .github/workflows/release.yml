name: Release

# Publishes to crates.io and creates a GitHub Release when a version tag is pushed.
#
# Flow: bump `version` in Cargo.toml, move the `[Unreleased]` notes in CHANGELOG.md under the new
# version, commit, `git tag <version>`, `git push origin master --tags`.
#
# Authentication uses crates.io Trusted Publishing (OIDC) — no long-lived token is stored in
# GitHub. The crate's settings page on crates.io must list this repository and the workflow file
# name `release.yml`.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release
      id-token: write # mint the crates.io OIDC token
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Tag must match Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match Cargo.toml version '$version'"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v ver="$GITHUB_REF_NAME" '
            /^## \[/ { if (found) exit; found = ($0 ~ "^## \\[" ver "\\]") ; next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no '## [$GITHUB_REF_NAME]' section"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Package check
        run: cargo publish --locked --dry-run

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
